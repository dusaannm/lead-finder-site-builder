design:
  recent_sites: 8
  directions_offered: 3
  fonts_offered: {display: 6, body: 4, accent: 2}
  directions:
    - name: poster
      how: "The first screen is one enormous line of tightly set type that fills the width, with a hard edged photograph cropped beneath or behind it. Flat colour, no decoration."
    - name: full-bleed
      how: "Photographs run edge to edge and carry the page. Text sits on solid blocks cut into the image with hard corners, never on a dark wash."
    - name: editorial
      how: "Laid out like a magazine feature: a masthead, thin rules, columns of unequal width, a large headline, small captions and pull lines set big."
    - name: board
      how: "The first screen is what they sell, set large like a menu board or a price list without prices, and the page unfolds from that list instead of from a slogan."
    - name: split
      how: "A hard vertical split on desktop: one half holds a photograph or a colour that stays fixed while the other half scrolls. It stacks into strong full width blocks on a phone."
    - name: cinematic
      how: "A near black page, very high contrast, one vivid accent, photographs that glow against the dark, and long vertical rhythm between big statements."
    - name: colour-block
      how: "Each section is its own saturated flat colour with hard edges between them, and big type that changes colour with the section. Confident, almost graphic poster work."
    - name: swiss
      how: "A strict visible grid, one grotesque typeface at extreme sizes, numbered sections, hairlines, asymmetric white space and no ornament at all."
    - name: collage
      how: "Photographs overlap at hard angles with type crossing them and labels stuck on top, like a pinned up wall. Controlled, but alive."
    - name: signage
      how: "Built like street signage: a moving text strip, oversized numbers, the hours and the address set as large as the headline, and heavy condensed capitals."
    - name: object
      how: "The page takes the form of a real object from this trade, such as a receipt, a work order, a sewing tag or a stamped ticket, and that idea runs through every section."
    - name: quiet
      how: "Very sparse and precise: one big image at a time, small exact type, huge margins, and every element placed on purpose. Expensive by restraint."

audit:
  enabled: true
  timeout_seconds: 12
  workers: 8
  slow_seconds: 5
  very_slow_seconds: 9
  stale_after_years: 3
  poor_website_below: 60
  penalties:
    no_https: 15
    no_viewport: 30
    slow: 5
    very_slow: 10
    stale_year: 20
    no_title: 10
    no_description: 10
    dated_platform: 15
    template_platform: 5
  messages:
    unreachable: "The website does not open at all, so anyone who searches for you online finds nothing."
    no_https: "The site has no security certificate, so browsers put a 'Not secure' warning next to the address."
    no_viewport: "The site does not adapt to phones, and roughly 70% of people look you up on a phone."
    slow: "The site needs {seconds} seconds to load, and most visitors give up before that."
    very_slow: "The site needs {seconds} seconds to load, which is slow enough that most visitors never see it."
    stale_year: "Nothing on the site has changed since {year}, which makes the business look closed."
    no_title: "The page has no title, so Google shows a blank line or the bare address in search results."
    no_description: "The page has no description, so Google invents its own text for your search result."
    dated_platform: "The site still runs on {platform}, which is years behind and a security risk as much as a look."
    template_platform: "The site is a {platform} template, so it looks like thousands of others and cannot be tailored much."

